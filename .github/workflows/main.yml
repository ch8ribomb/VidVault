name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Read version
        id: ver
        shell: bash
        run: echo "v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' blogpix.py | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - name: Build exe
        run: pyinstaller --onefile --windowed --name BlogPix_v${{ steps.ver.outputs.v }} --icon BlogPix.ico --add-data "BlogPix.ico;." blogpix.py

      - uses: actions/upload-artifact@v4
        with:
          name: BlogPix_v${{ steps.ver.outputs.v }}-windows
          path: dist/BlogPix_v${{ steps.ver.outputs.v }}.exe

      - name: Publish release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BlogPix_v${{ steps.ver.outputs.v }}.exe
